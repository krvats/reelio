<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reelio</title>
<meta name="description" content="Your videos, posted automatically to Instagram and YouTube.">
<meta name="theme-color" content="#0c2a33">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

<script>try{var t=JSON.parse(localStorage.getItem('reelio.theme'));if(t&&t!=='auto')document.documentElement.dataset.theme=t;var a=JSON.parse(localStorage.getItem('reelio.accent'));if(a&&a!=='teal')document.documentElement.dataset.accent=a}catch(e){}</script>

<div id="root"><div class="splash" id="splash" role="status" aria-label="Loading Reelio">

<div class="strip3" aria-hidden="true"><i></i><i></i><i></i></div></div></div>

<script type="module" src="js/app.js"></script>

</html>
