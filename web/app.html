<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reelio</title>
<meta name="description" content="Your videos, posted automatically to Instagram and YouTube.">
<meta name="theme-color" content="#0c1a32">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="js/app.js"><link rel="modulepreload" href="js/core.js"><link rel="modulepreload" href="js/i18n.js"><link rel="modulepreload" href="js/v_home.js">
<script>try{var t=JSON.parse(localStorage.getItem('reelio.theme'));if(t&&t!=='auto')document.documentElement.dataset.theme=t;var a=JSON.parse(localStorage.getItem('reelio.accent'));if(a&&a!=='orange')document.documentElement.dataset.accent=a}catch(e){}</script>
</head>
<body>
<div id="root"><div class="splash" id="splash" role="status" aria-label="Loading Reelio">
<svg class="reel" viewBox="0 0 64 64" aria-hidden="true"><rect x="5" y="5" width="54" height="54" rx="10" fill="#f3cd03" stroke="#0c1a32" stroke-width="4"/><circle cx="32" cy="32" r="15" fill="none" stroke="#0c1a32" stroke-width="4"/><circle cx="32" cy="32" r="3.6" fill="#0c1a32"/><circle cx="32" cy="22" r="3" fill="#0c1a32"/><circle cx="32" cy="42" r="3" fill="#0c1a32"/><circle cx="22" cy="32" r="3" fill="#0c1a32"/><circle cx="42" cy="32" r="3" fill="#dc3845"/></svg>
<div class="strip3" aria-hidden="true"><i></i><i></i><i></i></div></div></div>
<noscript>Reelio needs JavaScript.</noscript>
<script src="app-config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
