<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reelio payments</title>
<style>body{font:17px/1.5 system-ui,sans-serif;margin:0;padding:18px;background:#edebe7;color:#0c1a32}.card{background:#f4f4f4;border:3px solid #0c1a32;box-shadow:4px 4px 0 #0c1a32;border-radius:12px;padding:14px;margin:12px auto;max-width:720px}
input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid #0c1a32}button{cursor:pointer;background:#cf3d0a;color:#fff;border-color:#cf3d0a;font-weight:700}button.no{background:#fff;color:#b81f2c;border-color:#b81f2c}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style></head><body>
<div class="card"><h1 style="margin:0 0 8px">Payments to approve</h1><p>Check each UTR in your UPI app (FamPay history), then approve. Nothing is unlocked until you do.</p>
<div class="row"><input id="u" placeholder="License service address" size="34"><input id="k" type="password" placeholder="Admin key" size="22"><button id="go">Load</button></div></div><div id="out"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#u').value=localStorage.getItem('reelio.licurl')||'';
const call=async(p,b)=>{const r=await fetch($('#u').value.replace(/\/$/,'')+p,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('#k').value},body:JSON.stringify(b||{})});const j=await r.json();if(!r.ok)throw new Error(j.message||r.status);return j};
async function load(){localStorage.setItem('reelio.licurl',$('#u').value);try{const {pending}=await call('/v1/admin/upi/pending');$('#out').innerHTML=pending.length?pending.map(c=>`<div class="card"><b>${esc(c.plan)} · ₹${c.amount}</b><div>UTR: <b>${esc(c.utr)}</b></div><div style="color:#4a5078">${new Date(c.at*1000).toLocaleString()} ${esc(c.note||'')}</div><div class="row" style="margin-top:8px"><button data-a="approve" data-id="${c.id}">Approve 30 days</button><button class="no" data-a="reject" data-id="${c.id}">Reject</button></div></div>`).join(''):'<div class="card">Nothing waiting.</div>'}catch(e){$('#out').innerHTML='<div class="card" style="color:#b81f2c">'+esc(e.message)+'</div>'}}
$('#go').onclick=load;$('#out').onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{await call('/v1/admin/upi/'+b.dataset.a,{id:b.dataset.id,days:30});load()}catch(x){alert(x.message)}};
</script></body></html>
