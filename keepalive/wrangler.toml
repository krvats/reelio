name = "reelio-keepalive"
main = "src/index.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["*/5 * * * *", "7 * * * *"]   # every 5 minutes: posting worker; minute 7 of every hour: long videos

[vars]
GH_REPO = "krvats/reelio"
GH_REF = "main"
# Secret (never write it in this file):  npx wrangler secret put GH_TOKEN
