name: Reelio save to Drive
# Copies YouTube / Instagram videos into your own Google Drive as mp4 files, fully in the cloud.
# Starts when you add a link in the app (Save to Drive page), continues by itself until every video is saved,
# and wakes once an hour to pick up anything that was waiting (a pause, a retry timer, a new video in a playlist you re-added).
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
concurrency:
  group: reelio-grab
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Make room for big videos
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt && pip install -U "yt-dlp[default]"
      - name: Fetch your private data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ vars.DATA_REPO || 'reelio-data' }}
          token: ${{ secrets.DATA_PAT }}
          path: data
      - name: Save videos to Drive
        id: grab
        working-directory: worker
        env:
          REELIO_KEY: ${{ secrets.REELIO_KEY }}
        run: python -m reelio grab --data ../data --budget 320
      - name: Continue with the next videos
        if: steps.grab.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_PAT }}
        run: gh workflow run grab.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}"
      - name: Keep the hourly check alive (GitHub pauses idle public repos after 60 days)
        env:
          GH_TOKEN: ${{ secrets.DATA_PAT }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/grab.yml/enable" || true
