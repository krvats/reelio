name: Reelio hosted worker
# Only for the hosted multi-user product. Does nothing until the repository variable HOSTED is set to "1".
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency:
  group: reelio-hosted
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  serve:
    if: ${{ vars.HOSTED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: worker/requirements.txt }
      - run: pip install -r worker/requirements.txt && pip install -U "yt-dlp[default]"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Serve flows from the Reelio API
        working-directory: worker
        env:
          REELIO_API_URL: ${{ secrets.REELIO_API_URL }}
          REELIO_WORKER_KEY: ${{ secrets.REELIO_WORKER_KEY }}
          REELIO_WORKER_ID: gha-${{ github.run_id }}
        run: python -m reelio serve --budget 50
