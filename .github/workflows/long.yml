name: Reelio long videos
# Videos of any length (even 24 hours): cut into parts, each part downloaded and uploaded on its own.
# Starts when you add a video in the app, continues by itself until every part is up, and wakes once an hour
# to pick up anything that was waiting (for example after YouTube's daily upload limit resets).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: reelio-long
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Make room for big videos
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt && pip install -U "yt-dlp[default]"
      - name: Fetch your private data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ vars.DATA_REPO || 'reelio-data' }}
          token: ${{ secrets.DATA_PAT }}
          path: data
      - name: Run long videos
        id: long
        working-directory: worker
        env:
          REELIO_KEY: ${{ secrets.REELIO_KEY }}
        run: python -m reelio long --data ../data --budget 320
      - name: Continue with the next parts
        if: steps.long.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_PAT }}
        run: gh workflow run long.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}"
      - name: Keep the hourly check alive (GitHub pauses idle public repos after 60 days)
        env:
          GH_TOKEN: ${{ secrets.DATA_PAT }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/long.yml/enable" || true
